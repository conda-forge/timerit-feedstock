schema_version: 1

context:
  name: timerit
  version: 1.1.0

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/timerit-${{ version }}.tar.gz
  sha256: a12a7db82d8cc6a0e1bc3258e6eead7a21c617da5605083118d5c3e99927fb69

build:
  number: 2
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=41.0.1
    - pip
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - timerit
      pip_check: true
      python_version:
        - ${{ python_min }}
        - "*"

about:
  summary: A powerful multiline alternative to timeit
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://github.com/Erotemic/timerit

extra:
  recipe-maintainers:
    - jan-janssen
